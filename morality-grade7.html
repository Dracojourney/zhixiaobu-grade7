<script>
// ============================================================
// 知识点数据（上册 4单元 10课）
// ============================================================
var REVIEW_DATA = Grade7.Content.legacy('morality').REVIEW_DATA;

// ============================================================
// 单元小结测试 - 真题风格（每单元7题，精选题型）
// 题型：选择题3道 + 判断题2道 + 材料分析题1道 + 综合探究与辨析1道
// ============================================================
var UNIT_QUIZ = Grade7.Content.legacy('morality').UNIT_QUIZ;

// 单元测试答题状态追踪
var unitQuizState = {}; // unitIndex -> { answers: [], score: 0, submitted: [], currentScore: 0 }

// ============================================================
// 真题风格题库 - 3轮难度递进
// 6大题型：材料选择、价值排序、名言解读、情境分析、观点辨析、综合探究
// ============================================================
var QUESTIONS = Grade7.Content.legacy('morality').QUESTIONS;

// ============================================================
// 全局状态
// ============================================================
var quizState = {
  mode: null, round: 1, questions: [], current: 0, score: 0,
  answered: false, results: [], selectedAnswer: null,
  matchState: {}, sortState: {}
};

var MODE_NAMES = {
  time: '材料选择', sort: '价值排序', match: '名言解读',
  art: '情境分析', find: '观点辨析', all: '综合探究'
};

var MODE_ICONS = {
  time: '\u270D', sort: '\u2195', match: '\u2696',
  art: '\u{1F4AC}', find: '\u2753', all: '\u2B50'
};

var MODE_DESCS = {
  time: '材料型选择题，中考主力题型',
  sort: '价值排序题，按重要性排序',
  match: '名言解读题，古语与道理匹配',
  art: '情境分析题，生活情境分析',
  find: '观点辨析题，找出错误观点',
  all: '6种真题题型混合，全真模拟'
};

var TOTAL_ROUNDS = 3;
var STORAGE_KEY = 'morality_quiz_grade7_v1';
var WRONGBOOK_KEY = 'wrongbook_v1';
var SUBJECT_ID = 'morality';
var SUBJECT_NAME = '道德与法治';

// ============================================================
// 错题本数据管理
// ============================================================
function loadWrongBook() {
  try {
    var s = localStorage.getItem(WRONGBOOK_KEY);
    if(s){var normalized=Grade7.Storage.normalizeLegacy(WRONGBOOK_KEY,s);if(normalized.data)return Grade7.Storage.legacyHTML(normalized.data);}
  } catch(e) {}
  return { history: [], morality: [], biology: [], geography: [] };
}

function saveWrongBook(wb) {
  try { localStorage.setItem(WRONGBOOK_KEY, JSON.stringify(wb)); } catch(e) {}
}

function addWrongQuestion(qInfo) {
  var wb = loadWrongBook();
  var list = wb[SUBJECT_ID] || [];
  // 检查是否已存在（用 q 内容去重）
  for (var i = 0; i < list.length; i++) {
    if (list[i].q === qInfo.q) {
      list[i].wrongCount++;
      list[i].lastWrongAt = Date.now();
      list[i].userAnswer = qInfo.userAnswer;
      wb[SUBJECT_ID] = list;
      saveWrongBook(wb);
      return;
    }
  }
  // 新增
  list.unshift({
    id: SUBJECT_ID + '_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
    subject: SUBJECT_NAME,
    subjectId: SUBJECT_ID,
    source: qInfo.source || '练习',
    q: qInfo.q,
    options: qInfo.options || null,
    answer: qInfo.answer,
    userAnswer: qInfo.userAnswer,
    explain: qInfo.explain || '',
    qType: qInfo.qType || 'choice',
    wrongCount: 1,
    addedAt: Date.now(),
    lastWrongAt: Date.now(),
    correctCount: 0
  });
  wb[SUBJECT_ID] = list;
  saveWrongBook(wb);
}

function markWrongCorrect(qid) {
  var wb = loadWrongBook();
  var list = wb[SUBJECT_ID] || [];
  for (var i = 0; i < list.length; i++) {
    if (list[i].id === qid) {
      list[i].correctCount = (list[i].correctCount || 0) + 1;
      wb[SUBJECT_ID] = list;
      saveWrongBook(wb);
      return;
    }
  }
}

function getWrongCount(subjectId) {
  var wb = loadWrongBook();
  return (wb[subjectId] || []).length;
}

// ============================================================
// 错题本页面渲染
// ============================================================
var wrongBookState = { current: 0, questions: [], selectedAnswer: null, answered: false, mode: 'list' };

function showWrongBook() {
  document.querySelectorAll('.section').forEach(function(s) { s.classList.remove('active'); });
  document.querySelectorAll('.nav-btn').forEach(function(b) { b.classList.remove('active'); });
  document.getElementById('wrongBookPanel').classList.add('active');
  renderWrongBookList();
}

function renderWrongBookList() {
  var wb = loadWrongBook();
  var list = wb[SUBJECT_ID] || [];
  var html = '';
  html += '<div class="wb-header">';
  html += '<h2 style="margin:0;">📕 错题本 — ' + SUBJECT_NAME + '</h2>';
  html += '<div class="wb-stats">共 <strong>' + list.length + '</strong> 道错题</div>';
  html += '</div>';
  
  if (list.length === 0) {
    html += '<div class="wb-empty">';
    html += '<div style="font-size:3em; margin-bottom:16px;">🎉</div>';
    html += '<div style="font-size:1.1em; color:var(--muted);">暂无错题，继续加油！</div>';
    html += '</div>';
  } else {
    html += '<div class="wb-toolbar">';
    html += '<button class="nav-btn" onclick="startWrongBookPractice()">🎯 重新练习全部错题</button>';
    html += '<span style="color:var(--muted); font-size:0.9em;">答对不删除，永久收录</span>';
    html += '</div>';
    html += '<div class="wb-list">';
    for (var i = 0; i < list.length; i++) {
      var item = list[i];
      html += '<div class="wb-card">';
      html += '<div class="wb-card-head">';
      html += '<span class="wb-tag">' + item.source + '</span>';
      html += '<span class="wb-count">错 ' + item.wrongCount + ' 次' + (item.correctCount ? ' · 练对 ' + item.correctCount + ' 次' : '') + '</span>';
      html += '</div>';
      html += '<div class="wb-card-q">' + (i+1) + '. ' + item.q + '</div>';
      if (item.options) {
        html += '<div class="wb-options">';
        for (var j = 0; j < item.options.length; j++) {
          var optClass = '';
          if (j === item.answer) optClass = 'correct';
          else if (j === item.userAnswer) optClass = 'wrong';
          html += '<div class="wb-option ' + optClass + '">' + 
                  '<span class="wb-opt-label">' + String.fromCharCode(65+j) + '</span>' + 
                  item.options[j] + '</div>';
        }
        html += '</div>';
      }
      if (item.explain) {
        html += '<div class="wb-explain"><strong>解析：</strong>' + item.explain + '</div>';
      }
      html += '</div>';
    }
    html += '</div>';
  }
  
  document.getElementById('wrongBookContent').innerHTML = html;
}

function startWrongBookPractice() {
  var wb = loadWrongBook();
  var list = wb[SUBJECT_ID] || [];
  if (list.length === 0) return;
  
  // 转换为选择题形式用于练习
  var questions = [];
  for (var i = 0; i < list.length; i++) {
    if (list[i].options) {
      questions.push({
        id: list[i].id,
        q: list[i].q,
        options: list[i].options,
        answer: list[i].answer,
        explain: list[i].explain,
        source: list[i].source,
        _isWrong: true
      });
    }
  }
  
  if (questions.length === 0) {
    alert('当前没有可练习的选择题型错题');
    return;
  }
  
  wrongBookState = {
    current: 0,
    questions: questions,
    selectedAnswer: null,
    answered: false,
    mode: 'practice',
    score: 0
  };
  
  renderWrongBookQuestion();
}

function renderWrongBookQuestion() {
  var q = wrongBookState.questions[wrongBookState.current];
  var total = wrongBookState.questions.length;
  var html = '';
  html += '<div class="wb-practice-header">';
  html += '<button class="nav-btn" onclick="renderWrongBookList()">← 返回错题本</button>';
  html += '<div class="wb-progress">第 ' + (wrongBookState.current+1) + ' / ' + total + ' 题</div>';
  html += '</div>';
  
  html += '<div class="q-card">';
  html += '<div class="q-source">' + (q.source || '错题练习') + '</div>';
  html += '<div class="q-text">' + (wrongBookState.current+1) + '. ' + q.q + '</div>';
  html += '<div class="q-options">';
  for (var i = 0; i < q.options.length; i++) {
    html += '<div class="q-option" onclick="wbSelectOption(' + i + ', this)" data-idx="' + i + '">';
    html += '<span class="q-opt-label">' + String.fromCharCode(65+i) + '</span>' + q.options[i] + '</div>';
  }
  html += '</div>';
  html += '<div id="wbFeedback" class="feedback"></div>';
  html += '<div class="q-actions">';
  html += '<button id="wbSubmitBtn" class="btn-primary" onclick="wbSubmitAnswer()">提交答案</button>';
  html += '<button id="wbNextBtn" class="btn-primary" onclick="wbNextQuestion()" style="display:none;">下一题 →</button>';
  html += '</div>';
  html += '</div>';
  
  document.getElementById('wrongBookContent').innerHTML = html;
}

function wbSelectOption(idx, el) {
  if (wrongBookState.answered) return;
  wrongBookState.selectedAnswer = idx;
  var opts = document.querySelectorAll('#wrongBookContent .q-option');
  for (var i = 0; i < opts.length; i++) {
    opts[i].classList.remove('selected');
  }
  el.classList.add('selected');
}

function wbSubmitAnswer() {
  var q = wrongBookState.questions[wrongBookState.current];
  if (wrongBookState.selectedAnswer === null) return;
  var isCorrect = wrongBookState.selectedAnswer === q.answer;
  
  var opts = document.querySelectorAll('#wrongBookContent .q-option');
  for (var i = 0; i < opts.length; i++) {
    opts[i].classList.add('disabled');
    if (i === q.answer) opts[i].classList.add('correct');
    else if (i === wrongBookState.selectedAnswer) opts[i].classList.add('wrong');
  }
  
  wrongBookState.answered = true;
  if (isCorrect) {
    wrongBookState.score += 10;
    markWrongCorrect(q.id);
  } else {
    // 答错了再记一次
    addWrongQuestion({
      q: q.q, options: q.options, answer: q.answer,
      userAnswer: wrongBookState.selectedAnswer, explain: q.explain,
      source: q.source, qType: 'choice'
    });
  }
  
  var fb = document.getElementById('wbFeedback');
  fb.className = 'feedback show ' + (isCorrect ? 'correct' : 'wrong');
  fb.innerHTML = '<div class="fb-title">' + (isCorrect ? '✅ 回答正确！+10分' : '❌ 答案有误') + '</div>';
  if (q.explain) fb.innerHTML += '<div class="fb-explain">' + q.explain + '</div>';
  
  document.getElementById('wbSubmitBtn').style.display = 'none';
  document.getElementById('wbNextBtn').style.display = 'inline-block';
}

function wbNextQuestion() {
  if (!wrongBookState.answered) return;
  wrongBookState.current++;
  if (wrongBookState.current >= wrongBookState.questions.length) {
    wbShowResult();
  } else {
    wrongBookState.answered = false;
    wrongBookState.selectedAnswer = null;
    renderWrongBookQuestion();
  }
}

function wbShowResult() {
  var total = wrongBookState.questions.length;
  var score = wrongBookState.score;
  var correct = Math.round(score / 10);
  var html = '';
  html += '<div class="wb-practice-header">';
  html += '<button class="nav-btn" onclick="renderWrongBookList()">← 返回错题本</button>';
  html += '</div>';
  html += '<div class="result-card">';
  html += '<div class="result-title">错题练习完成</div>';
  html += '<div class="result-score">' + score + '</div>';
  html += '<div class="result-sub">答对 ' + correct + ' / ' + total + ' 题</div>';
  html += '<div class="result-tip">错题永久保留，可反复练习加深印象</div>';
  html += '<div class="result-actions">';
  html += '<button class="btn-primary" onclick="startWrongBookPractice()">🔄 再练一次</button>';
  html += '<button class="nav-btn" onclick="renderWrongBookList()">查看错题</button>';
  html += '</div></div>';
  document.getElementById('wrongBookContent').innerHTML = html;
}

// ============================================================
// 数据持久化（进度、答题状态）
// ============================================================
function loadAllData() {
  try {
    var s = localStorage.getItem(STORAGE_KEY);
    if(s){var normalized=Grade7.Storage.normalizeLegacy(STORAGE_KEY,s);if(normalized.data)return Grade7.Storage.legacyHTML(normalized.data);}
  } catch(e) {}
  return {
    rounds: { time: 1, sort: 1, match: 1, art: 1, find: 1, all: 1 },
    stats: [],
    sessions: {}
  };
}

function saveAllData(d) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); } catch(e) {}
}

function getRound(mode) {
  var d = loadAllData();
  return d.rounds[mode] || 1;
}

function advanceRound(mode) {
  var d = loadAllData();
  if (d.rounds[mode] < TOTAL_ROUNDS) {
    d.rounds[mode]++;
    saveAllData(d);
    return true;
  }
  return false;
}

function saveSession() {
  var d = loadAllData();
  d.sessions[quizState.mode] = {
    round: quizState.round,
    current: quizState.current,
    score: quizState.score,
    questions: quizState.questions,
    results: quizState.results,
    answered: quizState.answered,
    selectedAnswer: quizState.selectedAnswer,
    matchState: quizState.matchState,
    sortState: quizState.sortState
  };
  saveAllData(d);
}

function loadSession(mode) {
  var d = loadAllData();
  if (d.sessions[mode]) return d.sessions[mode];
  return null;
}

function clearSession(mode) {
  var d = loadAllData();
  delete d.sessions[mode];
  saveAllData(d);
}

function hasUnfinishedSession(mode) {
  var s = loadSession(mode);
  if (!s) return false;
  return s.current < s.questions.length;
}

// ============================================================
// 模式列表渲染
// ============================================================
function renderModes() {
  var container = document.getElementById('quizModes');
  var modes = ['time', 'sort', 'match', 'art', 'find', 'all'];
  var html = '';
  for (var i = 0; i < modes.length; i++) {
    var m = modes[i];
    var round = getRound(m);
    var hasSession = hasUnfinishedSession(m);
    var progressTag = hasSession ? '<span class="mode-progress-tag">继续</span>' : '';
    html += '<div class="mode-card" onclick="startQuiz(\'' + m + '\')">';
    html += progressTag;
    html += '<div class="mode-icon">' + MODE_ICONS[m] + '</div>';
    html += '<div class="mode-name">' + MODE_NAMES[m] + '</div>';
    html += '<div class="mode-desc">' + MODE_DESCS[m] + '</div>';
    html += '<div class="mode-count">3轮进阶 / 每轮10题</div>';
    html += '<span class="mode-round">当前 第' + round + '轮</span>';
    html += '</div>';
  }
  container.innerHTML = html;
}

// ============================================================
// 知识回顾渲染
// ============================================================
function renderReview() {
  var container = document.getElementById('review-content');
  var html = '';
  for (var i = 0; i < REVIEW_DATA.length; i++) {
    var unit = REVIEW_DATA[i];
    html += '<div class="unit-card" data-unit="' + i + '">';
    html += '<div class="unit-header" onclick="toggleUnit(' + i + ')">';
    html += '<div><div class="unit-title">' + unit.name + '</div>';
    html += '<div class="unit-period">' + unit.period + '</div></div>';
    html += '<div class="toggle">+</div></div>';
    html += '<div class="unit-body"><div class="lessons">';
    for (var j = 0; j < unit.lessons.length; j++) {
      var lesson = unit.lessons[j];
      var stars = '';
      for (var s = 0; s < lesson.star; s++) stars += '★';
      html += '<div class="lesson-block" data-lesson="' + j + '">';
      html += '<div class="lesson-title" onclick="toggleLesson(' + i + ',' + j + ')">';
      html += '<span class="star">' + stars + '</span> ' + lesson.name + '</div>';
      html += '<div class="point-list">';
      for (var k = 0; k < lesson.points.length; k++) {
        var p = lesson.points[k];
        var freqClass = p.f === '高频' ? 'freq-high' : 'freq-mid';
        html += '<div class="point-card">';
        html += '<div class="point-title">' + p.t + ' <span class="freq ' + freqClass + '">' + p.f + '</span></div>';
        html += '<div class="point-content">' + p.c + '</div>';
        html += '<div class="point-type">常考题型：' + p.type + '</div>';
        html += '</div>';
      }
      html += '</div></div>';
    }
    // 单元小结测试

// 单元小结测试逻辑

function initUnitQuizState(ui) {

      if (state.answers[i] === false) html += ' selected';

        else if (state.answers[i] === false) html += ' wrong';
        html += ' disabled';
      }
      html += '" onclick="selectUnitJudge(' + ui + ',' + i + ',false)">错误</div>';
      html += '</div>';
    } else {
      html += '<div class="uq-options">';
      var labels = ['A', 'B', 'C', 'D'];
      for (var o = 0; o < q.options.length; o++) {
        html += '<div class="uq-option';
        if (state.answers[i] === o) html += ' selected';
        if (state.submitted[i]) {
          if (q.answer === o) html += ' correct';
          else if (state.answers[i] === o) html += ' wrong';
          html += ' disabled';
        }
        html += '" onclick="selectUnitOption(' + ui + ',' + i + ',' + o + ')">';

      html += '</div>';

    if (!state.submitted[i]) {
      html += '<div class="btn-row">';

      html += '</div>';

  // 得分统计条

function submitUnitAnswer(ui, qi) {
  var state = unitQuizState[ui];
  var unitQuiz = UNIT_QUIZ[ui];
  var q = unitQuiz.questions[qi];
  if (state.answers[qi] === null) return;
  state.submitted[qi] = true;
  var correct = false;
  if (q.type === 'judge') {
    correct = state.answers[qi] === q.answer;
  } else {
    correct = state.answers[qi] === q.answer;
  }
  if (correct) state.currentScore += 10;

  // 错题收录（单元小结测试）
  if (!correct) {

// ============================================================
// 互动测试 - 开始/返回
// ============================================================
function startQuiz(mode) {
  var session = loadSession(mode);
  if (session && session.current < session.questions.length) {
    quizState.mode = mode;
    quizState.round = session.round;
    quizState.current = session.current;
    quizState.score = session.score;
    quizState.questions = session.questions;
    quizState.results = session.results;
    quizState.answered = session.answered;
    quizState.selectedAnswer = session.selectedAnswer;
    quizState.matchState = session.matchState || {};
    quizState.sortState = session.sortState || {};
    
    document.getElementById('quizIntro').style.display = 'none';
    var area = document.getElementById('quizArea');
    area.style.display = 'block';
    area.classList.add('active');
    renderQuestionFromState();
    return;
  }
  
  var round = getRound(mode);
  var roundKey = 'round' + round;
  
  var questions = [];
  if (mode === 'all') {
    var allModes = ['time', 'sort', 'match', 'art', 'find'];
    var pool = [];
    for (var m = 0; m < allModes.length; m++) {
      var modeQuestions = QUESTIONS[allModes[m]][roundKey];
      for (var q = 0; q < modeQuestions.length; q++) {
        pool.push({ type: allModes[m], data: modeQuestions[q] });
      }
    }
    pool = shuffle(pool);
    questions = pool.slice(0, 10);
  } else {
    var rawQuestions = QUESTIONS[mode][roundKey];
    var shuffled = shuffle(rawQuestions.slice());
    var selected = shuffled.slice(0, 10);
    for (var i = 0; i < selected.length; i++) {
      questions.push({ type: mode, data: selected[i] });
    }
  }
  
  quizState.mode = mode;
  quizState.round = round;
  quizState.questions = questions;
  quizState.current = 0;
  quizState.score = 0;
  quizState.answered = false;
  quizState.results = [];
  quizState.selectedAnswer = null;
  quizState.matchState = {};
  quizState.sortState = {};
  
  // 初始化排序题状态
  for (var i = 0; i < questions.length; i++) {
    if (questions[i].type === 'sort') {
      quizState.sortState[i] = questions[i].data.items.slice();
    }
  }
  
  document.getElementById('quizIntro').style.display = 'none';
  var area = document.getElementById('quizArea');
  area.style.display = 'block';
  area.classList.add('active');
  
  saveSession();
  renderQuestion();
}

function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i];
    a[i] = a[j];
    a[j] = t;
  }
  return a;
}

function backToModes() {
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('quizIntro').style.display = 'block';
  renderModes();
}

  // 匹配题
  else if (q.type === 'match') {

// ============================================================
// 互动测试 - 交互函数
// ============================================================
function selectOption(idx) {
  if (quizState.answered) return;
  quizState.selectedAnswer = idx;
  saveSession();
  renderQuestionFromState();
}

function moveSort(pos, dir) {
  if (quizState.answered) return;
  var items = quizState.sortState[quizState.current];
  var newPos = pos + dir;
  if (newPos < 0 || newPos >= items.length) return;
  var t = items[pos];
  items[pos] = items[newPos];
  items[newPos] = t;
  saveSession();
  var q = quizState.questions[quizState.current];
  reRenderSort(q);
  // 更新提交按钮状态
  var btn = document.querySelector('.btn-primary');
  if (btn) btn.disabled = false;
}

function selectMatch(side, idx) {
  if (quizState.answered) return;
  var ms = quizState.matchState[quizState.current];
  if (!ms) return;
  
  if (side === 'left') {
    // 检查是否已经匹配
    if (ms.pairs.indexOf(idx) >= 0) return;
    ms.leftIdx = idx;
  } else {
    // 右边
    if (ms.leftIdx === null) return;
    if (ms.pairs[idx] !== null) return;
    ms.pairs[idx] = ms.leftIdx;
    ms.pairCount++;
    ms.leftIdx = null;
  }
  
  saveSession();
  var q = quizState.questions[quizState.current];
  reRenderMatch(q);
  
  // 检查是否全部匹配完成，更新提交按钮
  if (ms.pairCount === q.data.right.length) {
    var btn = document.querySelector('.btn-primary');
    if (btn) btn.disabled = false;
  }
}

function submitAnswer() {
  if (quizState.answered) return;
  var q = quizState.questions[quizState.current];
  var correct = false;
  
  // 选择题
  if (q.type === 'time' || q.type === 'art' || q.type === 'find') {
    if (quizState.selectedAnswer === null) return;
    correct = quizState.selectedAnswer === q.data.answer;
  }
  // 排序题
  else if (q.type === 'sort') {
    var items = quizState.sortState[quizState.current];
    var correctOrder = q.data.order;
    var allCorrect = true;
    for (var i = 0; i < items.length; i++) {
      var correctIdx = correctOrder[i];
      if (items[i] !== q.data.items[correctIdx]) {
        allCorrect = false;
        break;
      }
    }
    correct = allCorrect;
  }
  // 匹配题
  else if (q.type === 'match') {
    var ms = quizState.matchState[quizState.current];
    if (!ms || ms.pairCount < q.data.right.length) return;
    var allMatch = true;
    for (var i = 0; i < q.data.pairs.length; i++) {
      if (ms.pairs[i] !== q.data.pairs[i]) {
        allMatch = false;
        break;
      }
    }
    correct = allMatch;
  }
  // all模式
  else if (q.type === 'all') {
    if (q.data.type === 'choice' || q.data.type === 'find') {
      if (quizState.selectedAnswer === null) return;
      correct = quizState.selectedAnswer === q.data.answer;
    } else if (q.data.type === 'sort') {
      var items = quizState.sortState[quizState.current];
      var correctOrder = q.data.order;
      var allCorrect = true;
      for (var i = 0; i < items.length; i++) {
        var correctIdx = correctOrder[i];
        if (items[i] !== q.data.items[correctIdx]) {
          allCorrect = false;
          break;
        }
      }
      correct = allCorrect;
    } else if (q.data.type === 'match') {
      var ms = quizState.matchState[quizState.current];
      if (!ms || ms.pairCount < q.data.right.length) return;
      var allMatch = true;
      for (var i = 0; i < q.data.pairs.length; i++) {
        if (ms.pairs[i] !== q.data.pairs[i]) {
          allMatch = false;
          break;
        }
      }
      correct = allMatch;
    }
  }
  
  if (correct) {
    quizState.score += 10;
  }

  // 错题收录
  if (!correct) {
    var modeNames = { time:'概念辨析', sort:'时间线排序', match:'案例匹配', art:'材料分析', find:'价值判断', all:'综合挑战' };
    var qText = '';
    var qOptions = null;
    var qAnswer = null;
    var qExplain = '';
    var qType = 'choice';

    if (q.type === 'time' || q.type === 'art' || q.type === 'find') {
      qText = q.data.q;
      qOptions = q.data.options;
      qAnswer = q.data.answer;
      qExplain = q.data.explain || '';
      qType = 'choice';
    } else if (q.type === 'all') {
      if (q.data.type === 'choice' || q.data.type === 'find') {
        qText = q.data.q;
        qOptions = q.data.options;
        qAnswer = q.data.answer;
        qExplain = q.data.explain || '';
        qType = 'choice';
      }
    }

    if (qText && qOptions !== null) {
      addWrongQuestion({
        q: qText,
        options: qOptions,
        answer: qAnswer,
        userAnswer: quizState.selectedAnswer,
        explain: qExplain,
        source: '互动测试-' + (modeNames[quizState.mode] || '练习') + ' 第' + quizState.round + '轮',
        qType: qType
      });
    }
  }

  quizState.answered = true;
  quizState.results.push({
    correct: correct,
    answer: quizState.selectedAnswer
  });
  
  saveSession();
  renderQuestionFromState();
}

function revealAnswer(q) {
  var feedback = document.getElementById('feedback');
  var fbTitle = document.getElementById('fbTitle');
  var fbExplain = document.getElementById('fbExplain');
  
  var lastResult = quizState.results[quizState.results.length - 1];
  if (lastResult.correct) {
    feedback.className = 'feedback correct show';
    fbTitle.textContent = '回答正确！+10分';
  } else {
    feedback.className = 'feedback wrong show';
    fbTitle.textContent = '回答错误';
  }
  
  fbExplain.innerHTML = '<strong>解析：</strong>' + q.data.explain;
  
  // 排序题显示正确位置
  if (q.type === 'sort') {
    var sortItems = document.querySelectorAll('.sort-item');
    var correctOrder = q.data.order;
    for (var i = 0; i < sortItems.length; i++) {
      var currentItem = quizState.sortState[quizState.current][i];
      var correctItem = q.data.items[correctOrder[i]];
      if (currentItem === correctItem) {
        sortItems[i].classList.add('placed');
      } else {
        sortItems[i].classList.add('placed', 'wrong-pos');
      }
    }
  }
}

function nextQuestion() {
  quizState.current++;
  quizState.answered = false;
  quizState.selectedAnswer = null;
  saveSession();
  renderQuestion();
}

function showResult() {
  var total = quizState.questions.length;
  var score = quizState.score;
  var percent = Math.round(score / total * 10);
  var correct = quizState.results.filter(function(r) { return r.correct; }).length;
  
  var grade = '';
  var msg = '';
  if (percent >= 9) { grade = '优秀'; msg = '太棒了！你对道法知识掌握得非常扎实！'; }
  else if (percent >= 7) { grade = '良好'; msg = '不错哦！继续努力，争取更好的成绩！'; }
  else if (percent >= 6) { grade = '及格'; msg = '基本掌握了知识点，还需要多加练习哦！'; }
  else { grade = '需努力'; msg = '要加油哦！多复习知识点，相信你一定可以的！'; }
  
  var area = document.getElementById('quizArea');
  var html = '';
  html += '<button class="back-btn" onclick="backToModes()">&#8592; 返回模式选择</button>';
  
  html += '<div class="result-card">';
  html += '<h2 style="color:var(--gold);margin-bottom:10px;">' + MODE_NAMES[quizState.mode] + ' - 第' + quizState.round + '轮</h2>';
  html += '<div class="result-grade">' + grade + '</div>';
  html += '<div class="result-score">' + percent + '分</div>';
  html += '<div class="result-msg">' + msg + '</div>';
  
  html += '<div class="result-badges">';
  html += '<span class="badge">共 ' + total + ' 题</span>';
  html += '<span class="badge">正确 ' + correct + ' 题</span>';
  html += '<span class="badge">正确率 ' + Math.round(correct / total * 100) + '%</span>';
  html += '</div>';
  
  html += '<div class="result-detail">';
  html += '<div class="result-row"><span>模式</span><span>' + MODE_NAMES[quizState.mode] + '</span></div>';
  html += '<div class="result-row"><span>轮次</span><span>第 ' + quizState.round + ' 轮</span></div>';
  html += '<div class="result-row"><span>总得分</span><span>' + score + ' 分</span></div>';
  html += '<div class="result-row"><span>百分制</span><span>' + Math.round(score / total * 100) + ' 分</span></div>';
  html += '</div>';
  
  // 晋级提示
  var canAdvance = percent >= 7 && quizState.round < TOTAL_ROUNDS;
  if (canAdvance) {
    html += '<div class="round-upgrade">恭喜你达到70分以上，已解锁下一轮！</div>';
    advanceRound(quizState.mode);
  } else if (percent < 7 && quizState.round < TOTAL_ROUNDS) {
    html += '<div style="margin-top:16px;padding:12px 16px;border-radius:10px;background:rgba(229,57,53,0.1);border:1px solid var(--crimson);color:var(--crimson);font-size:0.9em;">得分不足70分，继续努力，再试一次吧！</div>';
  } else if (quizState.round >= TOTAL_ROUNDS && percent >= 7) {
    html += '<div class="round-upgrade">恭喜你完成了全部3轮挑战，你已经掌握了本模式的知识点！</div>';
  }
  
  // 保存统计
  saveStats(percent, correct, total, quizState.mode, quizState.round);
  
  // 清除session
  clearSession(quizState.mode);
  
  html += '<div class="btn-row" style="justify-content:center;">';
  html += '<button class="btn btn-secondary" onclick="backToModes()">返回模式选择</button>';
  html += '<button class="btn btn-primary" onclick="retryQuiz()">再试一次</button>';
  html += '</div>';
  
  html += '</div>';
  
  area.innerHTML = html;
}

function retryQuiz() { 
  var mode = quizState.mode;
  clearSession(mode);
  startQuiz(mode);
}

// ============================================================
// 学习统计
// ============================================================
function saveStats(percent, correct, total, mode, round) {
  var d = loadAllData();
  var now = new Date();
  var dateStr = now.getFullYear() + '-' + (now.getMonth() + 1) + '-' + now.getDate() + ' ' + now.getHours() + ':' + (now.getMinutes() < 10 ? '0' : '') + now.getMinutes();
  d.stats.unshift({
    mode: MODE_NAMES[mode],
    round: round,
    percent: percent * 10,
    correct: correct,
    total: total,
    date: dateStr
  });
  if (d.stats.length > 50) d.stats = d.stats.slice(0, 50);
  saveAllData(d);
}

function renderStats() {
  var container = document.getElementById('statsContent');
  var d = loadAllData();
  
  if (d.stats.length === 0) {
    container.innerHTML = '<p style="color:var(--muted);">完成测试后，你的成绩和知识点掌握情况将在这里展示。</p>';
    return;
  }
  
  var totalTests = d.stats.length;
  var totalCorrect = 0;
  var totalQuestions = 0;
  var avgScore = 0;
  var bestScore = 0;
  
  for (var i = 0; i < d.stats.length; i++) {
    totalCorrect += d.stats[i].correct;
    totalQuestions += d.stats[i].total;
    avgScore += d.stats[i].percent;
    if (d.stats[i].percent > bestScore) bestScore = d.stats[i].percent;
  }
  avgScore = Math.round(avgScore / totalTests * 10) / 10;
  
  var html = '';
  html += '<div class="result-badges" style="margin-bottom:24px;">';
  html += '<span class="badge">完成测试 ' + totalTests + ' 次</span>';
  html += '<span class="badge">总题数 ' + totalQuestions + ' 题</span>';
  html += '<span class="badge">平均分 ' + avgScore + ' 分</span>';
  html += '<span class="badge">最高分 ' + bestScore + ' 分</span>';
  html += '</div>';
  
  html += '<h3 style="color:var(--accent);margin-bottom:12px;font-size:1em;">最近记录</h3>';
  html += '<div class="result-detail">';
  
  var showCount = Math.min(d.stats.length, 20);
  for (var i = 0; i < showCount; i++) {
    var r = d.stats[i];
    var color = r.percent >= 70 ? 'var(--jade)' : (r.percent >= 60 ? 'var(--gold)' : 'var(--crimson)');
    html += '<div class="result-row"><span>' + r.mode + ' 第' + r.round + '轮 - ' + r.date + '</span><span style="color:' + color + ';">' + r.percent + '分</span></div>';
  }
  html += '</div>';
  
  container.innerHTML = html;
}

// ============================================================
// 导航
// ============================================================
function switchTab(tabName) {
  var btns = document.querySelectorAll('.nav-btn');
  var secs = document.querySelectorAll('.section');
  for (var i = 0; i < btns.length; i++) {
    btns[i].classList.remove('active');
    if (btns[i].getAttribute('data-tab') === tabName) btns[i].classList.add('active');
  }
  for (var j = 0; j < secs.length; j++) {
    secs[j].classList.remove('active');
    if (secs[j].id === tabName) secs[j].classList.add('active');
  }
  if (tabName === 'quiz') renderModes();
  if (tabName === 'stats') renderStats();
}

// ============================================================
// 初始化
// ============================================================
window.g7InitLegacy = function(){ renderReview(); renderModes(); renderStats(); };
</script>
